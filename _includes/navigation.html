<nav class="site-nav" aria-label="Main navigation">
  {% for path in site.header_pages %}
    {% assign page_item = site.pages
      | where: "path", path
      | first
    %}

    {% if page_item %}
      <a href="{{ page_item.url | relative_url }}">
        {{ page_item.title | default: page_item.name }}
      </a>
    {% endif %}
  {% endfor %}
</nav>
